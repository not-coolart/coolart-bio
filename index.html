<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>CoolArt | Bio</title>
    <link rel="icon" type="image/png" href="5.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; transition: background 0.3s ease, border-color 0.3s ease, color 0.3s ease; }
        
        body { 
            min-height:100vh; 
            display:flex; 
            justify-content:center; 
            align-items:center; 
            background:#000; 
            overflow:hidden; 
            position:relative; 
            padding:20px;
            cursor: none; 
        }
        
        body.light-theme {
            background: #e2e8f0;
        }
        
        .custom-cursor {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            border-radius: 50%;
            position: fixed;
            transform: translate(-50%, -50%);
            pointer-events: none; 
            z-index: 9999;
            transition: transform 0.1s ease-out, background 0.2s, border-color 0.2s;
        }
        body.light-theme .custom-cursor {
            border-color: rgba(0, 0, 0, 0.3);
            background: rgba(0, 0, 0, 0.05);
        }
        body.hover-active .custom-cursor {
            transform: translate(-50%, -50%) scale(1.5);
            background: rgba(56, 189, 248, 0.2);
            border-color: #38bdf8;
        }

        #snow-canvas { position:absolute; top:0; left:0; width:100%; height:100%; z-index:0; pointer-events:none; }
        body.light-theme #snow-canvas { filter: invert(1) opacity(0.3); } /* Делаем снег темным на светлом фоне */
        
        .bio-container { position:relative; z-index:1; width:100%; max-width:950px; display:grid; grid-template-columns:1.4fr 1fr; gap:25px; align-items:stretch; }
        
        @media (max-width:850px) { 
            .bio-container { grid-template-columns:1fr; gap:15px; max-width:500px; padding-top:20px; padding-bottom:20px; } 
            body { overflow-y:auto; cursor: auto; } 
            .custom-cursor { display: none; }
        }
        
        .liquid-glass { background:rgba(255,255,255,0.05); backdrop-filter:blur(25px); -webkit-backdrop-filter:blur(25px); border-radius:24px; box-shadow:0 20px 40px rgba(0,0,0,0.5), inset 0 2px 2px rgba(255,255,255,0.3); border:1px solid rgba(255,255,255,0.12); overflow:hidden; display:flex; flex-direction:column; }
        body.light-theme .liquid-glass { background: rgba(255, 255, 255, 0.4); box-shadow: 0 20px 40px rgba(0,0,0,0.08), inset 0 2px 2px rgba(255,255,255,0.7); border: 1px solid rgba(0,0,0,0.08); }
        
        .terminal-card { width:100%; }
        .terminal-header { display:flex; align-items:center; padding:14px 20px; background:rgba(0,0,0,0.4); border-bottom:1px solid rgba(255,255,255,0.05); }
        body.light-theme .terminal-header { background: rgba(0, 0, 0, 0.05); border-bottom: 1px solid rgba(0,0,0,0.05); }
        
        .terminal-buttons { display:flex; gap:8px; }
        .dot { width:12px; height:12px; border-radius:50%; }
        .dot-red { background:#ff5f56; } .dot-yellow { background:#ffbd2e; } .dot-green { background:#27c93f; }
        .terminal-title { color:rgba(255,255,255,0.3); font-size:0.85rem; margin-left:20px; font-family:monospace; }
        body.light-theme .terminal-title { color: rgba(0, 0, 0, 0.4); }
        
        .terminal-body { padding:25px; flex-grow:1; font-family:'Consolas',monospace; font-size:1.05rem; line-height:1.6; color:#e2e8f0; white-space: pre-wrap; }
        body.light-theme .terminal-body { color: #1e293b; }
        @media (max-width:480px) { .terminal-body { font-size:0.9rem; padding:15px; } }
        
        .code-line { display:inline; white-space:pre-wrap; word-break:break-all; }
        
        .variable { color:#f472b6 !important; } 
        .key { color:#60a5fa !important; } 
        .string { color:#34d399 !important; } 
        .link { color:#38bdf8 !important; text-decoration:underline; cursor: none; }
        
        body.light-theme .variable { color: #db2777 !important; }
        body.light-theme .key { color: #2563eb !important; }
        body.light-theme .string { color: #16a34a !important; }
        body.light-theme .link { color: #0284c7 !important; }
        
        .typing-cursor { display:inline-block; width:2px; height:18px; background-color:#ffffff; margin-left:2px; vertical-align:middle; animation:blink 0.8s infinite; }
        body.light-theme .typing-cursor { background-color: #000000; }
        @keyframes blink { 50% { opacity:0; } }
        
        .profile-card { padding:35px 25px; align-items:center; text-align:center; justify-content:center; }
        @media (max-width:480px) { .profile-card { padding:25px 15px; } }
        
        .avatar-container { position:relative; width:96px; height:96px; margin-bottom:15px; display: inline-block; }
        .avatar { width:100%; height:100%; border-radius:50%; object-fit:cover; border:3px solid rgba(255,255,255,0.2); }
        body.light-theme .avatar { border-color: rgba(0, 0, 0, 0.1); }
        
        .name { color:#ffffff; font-size:1.6rem; font-weight:600; letter-spacing:0.5px; margin-bottom:4px; }
        body.light-theme .name { color: #0f172a; }
        
        .tag-wrapper { display:flex; align-items:center; justify-content:center; gap:4px; margin-bottom:15px; }
        .tag { color:#c7d2fe; font-size:0.95rem; }
        body.light-theme .tag { color: #4f46e5; }
        .role-badge { width:22px; height:22px; object-fit:contain; }
        
        .badges-container { display:flex; gap:10px; align-items:center; justify-content:center; flex-wrap:wrap; background:rgba(0,0,0,0.2); padding:8px 16px; border-radius:12px; border:1px solid rgba(255,255,255,0.03); margin-bottom:20px; }
        body.light-theme .badges-container { background: rgba(0,0,0,0.05); border-color: rgba(0,0,0,0.02); }

                .discord-badge { width:24px; height:24px; object-fit:contain; filter:drop-shadow(0 2px 4px rgba(0,0,0,0.4)); transition:transform 0.3s ease, filter 0.3s ease; cursor: none; }
        .discord-badge:hover { transform:translateY(-5px) scale(1.2); filter:drop-shadow(0 8px 12px rgba(0,0,0,0.6)); }
        .links-container { display:flex; flex-direction:column; width:100%; gap:10px; }
        .glass-btn { display:block; width:100%; padding:10px; text-align:center; color:#ffffff; text-decoration:none; font-size:0.9rem; font-weight:500; border-radius:12px; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.1); transition:all 0.3s ease; box-shadow:inset 0 1px 1px rgba(255,255,255,0.2); cursor: none; }
        .glass-btn:hover { background:rgba(255,255,255,0.1); border-color:rgba(255,255,255,0.25); transform:translateY(-2px); }
        .fade-in-up-1 { animation: fadeInUp 1.2s cubic-bezier(0.165, 0.84, 0.44, 1) forwards; }
        .fade-in-up-2 { opacity: 0; animation: fadeInUp 1.2s cubic-bezier(0.165, 0.84, 0.44, 1) 0.2s forwards; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(60px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="custom-cursor" id="cursor-dot"></div>
    <canvas id="snow-canvas"></canvas>
    <div class="bio-container">
        <div class="liquid-glass terminal-card fade-in-up-1">
            <div class="terminal-header">
                <div class="terminal-buttons"><div class="dot dot-red"></div><div class="dot dot-yellow"></div><div class="dot dot-green"></div></div>
                <div class="terminal-title">config.py — bash</div>
            </div>
            <div class="terminal-body" id="code-screen" style="white-space: pre-wrap;"></div>
        </div>
        <div class="liquid-glass profile-card fade-in-up-2">
            <div class="avatar-container"><img src="Avatar.png" alt="Avatar" class="avatar"></div>
            <h1 class="name">CoolArt</h1>
            <div class="tag-wrapper"><p class="tag">Discord bot developer</p><img src="5.png" alt="Dev Badge" class="role-badge"></div>
            <div class="badges-container">
                <img src="1.png" alt="B1" class="discord-badge"><img src="2.png" alt="B2" class="discord-badge"><img src="3.png" alt="B3" class="discord-badge"><img src="4.png" alt="B4" class="discord-badge">
            </div>
            <div class="links-container">
                <a href="https://discord.com/channels/@1245326906111430683" target="_blank" class="glass-btn">My Discord</a>
                <a href="https://github.com/not-coolart" target="_blank" class="glass-btn">My GitHub</a>
            </div>
        </div>
    </div>
    <script>
        const cursorDot = document.getElementById('cursor-dot');
        window.addEventListener('mousemove', (e) => { cursorDot.style.left = e.clientX + 'px'; cursorDot.style.top = e.clientY + 'px'; });
        
        function updateHover() {
            document.querySelectorAll('a, .glass-btn, .discord-badge, .link').forEach(l => {
                l.addEventListener('mouseenter', () => document.body.classList.add('hover-active'));
                l.addEventListener('mouseleave', () => document.body.classList.remove('hover-active'));
            });
        }
        updateHover();
        
        const canvas = document.getElementById('snow-canvas'); const ctx = canvas.getContext('2d'); let flakes = [];
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();
        for(let i=0; i<130; i++) flakes.push({ x:Math.random()*canvas.width, y:Math.random()*canvas.height, r:Math.random()*2+0.8, d:Math.random()*2+1.5, w:Math.random()*0.5-0.25 });
        setInterval(() => {
            ctx.clearRect(0,0,canvas.width,canvas.height); ctx.fillStyle = "rgba(255,255,255,0.7)"; ctx.beginPath();
            flakes.forEach(f => { ctx.moveTo(f.x, f.y); ctx.arc(f.x, f.y, f.r, 0, Math.PI*2, true); f.y+=f.d; f.x+=f.w; if(f.y>canvas.height) f.y=-10; if(f.x>canvas.width||f.x<0) f.x=Math.random()*canvas.width; });
            ctx.fill();
        }, 20);

        const lines = [
            '<span class="variable">coolart_info</span> = {',
            '    <span class="key">"Nickname"</span>: <span class="string">"CoolArt"</span>,',
            '    <span class="key">"Programming language"</span>: <span class="string">"Python 🐍"</span>,',
            '    <span class="key">"Birthday"</span>: <span class="string">"May 3rd"</span>,',
            '    <span class="key">"Age"</span>: <span class="string">"??"</span>,',
            '    <span class="key">"Gmt"</span>: <span class="string">"GMT+3"</span>,',
            '    <span class="key">"Live in"</span>: <span class="string">"Russia"</span>,',
            '    <span class="key">"Admin for"</span>: <span class="string">"<a href=\'https://discord.gg/stockholm\' target=\'_blank\' class=\'link\'>discord.gg/stockholm</a>"</span>',
            '}'
        ];
        const screen = document.getElementById('code-screen');
        const cursor = document.createElement('span'); cursor.className = 'typing-cursor'; screen.appendChild(cursor);
        let currentLine = 0;

        function typeLine() {
            if (currentLine < lines.length) {
                const lineContainer = document.createElement('span'); lineContainer.className = 'code-line'; screen.insertBefore(lineContainer, cursor);
                const tempDiv = document.createElement('div'); tempDiv.innerHTML = lines[currentLine];
                let nodes = Array.from(tempDiv.childNodes), nodeIndex = 0;
                function processNode() {
                    if (nodeIndex < nodes.length) {
                        let node = nodes[nodeIndex];
                        if (node.nodeType === Node.TEXT_NODE) {
                            let text = node.textContent, charIndex = 0;
                            function typeChar() {
                                if (charIndex < text.length) { lineContainer.appendChild(document.createTextNode(text[charIndex])); charIndex++; setTimeout(typeChar, Math.random()*15+10); } 
                                else { nodeIndex++; processNode(); }
                            }
                            typeChar();
                        } else {
                            let elementClone = node.cloneNode(false); lineContainer.appendChild(elementClone);
                            let text = node.textContent, charIndex = 0;
                            function typeElementChar() {
                                if (charIndex < text.length) { elementClone.appendChild(document.createTextNode(text[charIndex])); charIndex++; setTimeout(typeElementChar, Math.random()*15+10); } 
                                else { nodeIndex++; updateHover(); processNode(); }
                            }
                            typeElementChar();
                        }
                    } else { screen.insertBefore(document.createTextNode('\n'), cursor); currentLine++; setTimeout(typeLine, 250); }
                }
                processNode();
            }
        }
        setTimeout(typeLine, 1000);
    </script>
</body>
</html>
